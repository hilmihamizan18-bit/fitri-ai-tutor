<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fitri - IPA AI Tutor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-slate-900 text-white flex flex-col justify-between font-sans">

    <!-- Header -->
    <header class="p-3 bg-slate-800 border-b border-slate-700 flex items-center gap-3 shrink-0">
        <img src="fitri.jpg" 
             onerror="this.onerror=null; this.src='public/fitri.jpg';" 
             alt="Fitri Avatar" 
             class="w-8 h-8 rounded-full border border-indigo-400 object-cover shrink-0">
        <div>
            <h1 class="font-bold text-base text-indigo-300 leading-tight">Fitri AI Tutor IPA</h1>
            <p class="text-xs text-slate-400">Tutor Biologi, Fisika, & Kimia</p>
        </div>
    </header>

    <!-- Chat Container -->
    <main id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-4 max-w-2xl mx-auto w-full">
        <!-- Pesan Sambutan Fitri -->
        <div class="flex items-start gap-2.5">
            <img src="fitri.jpg" onerror="this.onerror=null; this.src='public/fitri.jpg';" class="w-7 h-7 rounded-full border border-indigo-400 object-cover shrink-0 mt-0.5">
            <div class="bg-slate-800 p-3 rounded-2xl rounded-tl-none border border-slate-700 text-sm max-w-[85%] leading-relaxed">
                Halo! Aku <b>Fitri</b>, tutor IPA kamu. Tanyakan apa saja tentang Biologi, Fisika, Kimia, atau obrolan santai lainnya. Aku siap bantu jelaskan sampai kamu paham dan puas! 😊
            </div>
        </div>
    </main>

    <!-- Input Form -->
    <footer class="p-3 bg-slate-800 border-t border-slate-700 max-w-2xl mx-auto w-full shrink-0">
        <form id="chat-form" class="flex gap-2">
            <input type="text" id="user-input" placeholder="Tanyakan soal IPA atau sapa Fitri..." required class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
            <button type="submit" id="send-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-xl text-sm font-semibold transition shrink-0">
                Kirim
            </button>
        </form>
    </footer>

    <!-- LOGIKA AI ASLI (GROQ API - LLAMA 3) -->
    <script>
        // MASUKKAN API KEY GROQ KAMU DI SINI (Contoh: "gsk_xxxxxxx")
        const GROQ_API_KEY = "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"; 

        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');

        // Menyimpan riwayat obrolan agar AI ingat konteks obrolan
        let messagesHistory = [
            {
                role: "system",
                content: "Kamu adalah Fitri, seorang guru dan tutor IPA (Biologi, Fisika, Kimia) yang sangat pinter, ramah, bersahabat, dan suka diajak bercanda. Jawablah pertanyaan pengguna dengan jelas, detail, akurat, dan gunakan bahasa yang hangat. JANGAN MENGGUNAKAN simbol LaTeX atau simbol dolar ($) untuk rumus. Tuliskan rumus dengan teks biasa (contoh: F = m x a)."
            }
        ];

        chatForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const text = userInput.value.trim();
            if(!text) return;

            // 1. Tampilkan Pesan User
            const userBubble = `
                <div class="flex items-start gap-3 justify-end">
                    <div class="bg-indigo-600 p-3 rounded-2xl rounded-tr-none text-sm max-w-[85%] leading-relaxed text-white">
                        ${text}
                    </div>
                </div>
            `;
            chatBox.insertAdjacentHTML('beforeend', userBubble);
            userInput.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Tambahkan ke riwayat
            messagesHistory.push({ role: "user", content: text });

            // 2. Loading
            const loadingId = 'loading-' + Date.now();
            const loadingBubble = `
                <div id="${loadingId}" class="flex items-start gap-2.5">
                    <img src="fitri.jpg" onerror="this.onerror=null; this.src='public/fitri.jpg';" class="w-7 h-7 rounded-full border border-indigo-400 object-cover shrink-0 mt-0.5">
                    <div class="bg-slate-800 p-3 rounded-2xl rounded-tl-none border border-slate-700 text-sm max-w-[85%] text-slate-400 italic">
                        Fitri sedang berpikir... 💭
                    </div>
                </div>
            `;
            chatBox.insertAdjacentHTML('beforeend', loadingBubble);
            chatBox.scrollTop = chatBox.scrollHeight;

            // 3. Panggil Server AI Pintar
            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: messagesHistory,
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId)?.remove();

                let aiAnswer = "";
                if (data.choices && data.choices[0].message) {
                    aiAnswer = data.choices[0].message.content;
                    // Simpan jawaban AI ke riwayat
                    messagesHistory.push({ role: "assistant", content: aiAnswer });
                } else {
                    aiAnswer = "Aduh maaf, Fitri agak pusing nih. Coba tanyakan lagi ya!";
                }

                // Bersihkan simbol dolar jika ada
                aiAnswer = aiAnswer.replace(/\$\$/g, '').replace(/\$/g, '').replace(/\n/g, '<br>');

                const fitriBubble = `
                    <div class="flex items-start gap-2.5">
                        <img src="fitri.jpg" onerror="this.onerror=null; this.src='public/fitri.jpg';" class="w-7 h-7 rounded-full border border-indigo-400 object-cover shrink-0 mt-0.5">
                        <div class="bg-slate-800 p-3 rounded-2xl rounded-tl-none border border-slate-700 text-sm max-w-[85%] leading-relaxed">
                            ${aiAnswer}
                        </div>
                    </div>
                `;
                chatBox.insertAdjacentHTML('beforeend', fitriBubble);

            } catch (error) {
                document.getElementById(loadingId)?.remove();
                const errorBubble = `
                    <div class="flex items-start gap-2.5">
                        <img src="fitri.jpg" onerror="this.onerror=null; this.src='public/fitri.jpg';" class="w-7 h-7 rounded-full border border-indigo-400 object-cover shrink-0 mt-0.5">
                        <div class="bg-slate-800 p-3 rounded-2xl rounded-tl-none border border-slate-700 text-sm max-w-[85%] text-red-400">
                            Fitri gagal terhubung. Pastikan API Key Groq kamu sudah terpasang dengan benar ya!
                        </div>
                    </div>
                `;
                chatBox.insertAdjacentHTML('beforeend', errorBubble);
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>
</body>
</html>
