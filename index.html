<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fitri - IPA AI Tutor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-slate-900 text-white flex flex-col justify-between font-sans">

    <!-- Header -->
    <header class="p-3 bg-slate-800 border-b border-slate-700 flex items-center gap-3 shrink-0">
        <img src="fitri.jpg" 
             onerror="this.onerror=null; this.src='public/fitri.jpg';" 
             alt="Fitri Avatar" 
             class="w-10 h-10 rounded-full border-2 border-indigo-400 object-cover shrink-0">
        <div>
            <h1 class="font-bold text-base text-indigo-300 leading-tight">Fitri AI Tutor IPA</h1>
            <p class="text-xs text-slate-400">Tutor Biologi, Fisika, & Kimia</p>
        </div>
    </header>

    <!-- Chat Container -->
    <main id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-4 max-w-2xl mx-auto w-full">
        <!-- Pesan Sambutan Fitri -->
        <div class="flex items-start gap-3">
            <img src="fitri.jpg" onerror="this.onerror=null; this.src='public/fitri.jpg';" class="w-8 h-8 rounded-full border border-indigo-400 object-cover shrink-0">
            <div class="bg-slate-800 p-3 rounded-2xl rounded-tl-none border border-slate-700 text-sm max-w-[85%] leading-relaxed">
                Halo! Aku <b>Fitri</b>, tutor IPA kamu. Kamu bisa tanya soal pelajaran 🧪 <b>Kimia</b>, 🧬 <b>Biologi</b>, maupun ⚡ <b>Fisika</b>. Ada materi yang mau kamu tanyakan hari ini? 😊
            </div>
        </div>
    </main>

    <!-- Input Form -->
    <footer class="p-3 bg-slate-800 border-t border-slate-700 max-w-2xl mx-auto w-full shrink-0">
        <form id="chat-form" class="flex gap-2">
            <input type="text" id="user-input" placeholder="Tanyakan soal Biologi, Fisika, Kimia..." required class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
            <button type="submit" id="send-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-xl text-sm font-semibold transition shrink-0">
                Kirim
            </button>
        </form>
    </footer>

    <!-- LOGIKA AI SUNGGUHAN (INTEGRASI GEMINI API) -->
    <script>
        // MASUKKAN API KEY GEMINI KAMU DI SINI
        const GEMINI_API_KEY = "Gemini API Key"; 

        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');

        chatForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const text = userInput.value.trim();
            if(!text) return;

            // 1. Tampilkan Pesan User
            const userBubble = `
                <div class="flex items-start gap-3 justify-end">
                    <div class="bg-indigo-600 p-3 rounded-2xl rounded-tr-none text-sm max-w-[85%] leading-relaxed text-white">
                        ${text}
                    </div>
                </div>
            `;
            chatBox.insertAdjacentHTML('beforeend', userBubble);
            userInput.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // 2. Loading
            const loadingId = 'loading-' + Date.now();
            const loadingBubble = `
                <div id="${loadingId}" class="flex items-start gap-3">
                    <img src="fitri.jpg" onerror="this.onerror=null; this.src='public/fitri.jpg';" class="w-8 h-8 rounded-full border border-indigo-400 object-cover shrink-0">
                    <div class="bg-slate-800 p-3 rounded-2xl rounded-tl-none border border-slate-700 text-sm max-w-[85%] text-slate-400 italic">
                        Fitri sedang mengetik jawaban... 💭
                    </div>
                </div>
            `;
            chatBox.insertAdjacentHTML('beforeend', loadingBubble);
            chatBox.scrollTop = chatBox.scrollHeight;

            // 3. Panggil AI Gemini
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `Kamu adalah Fitri, seorang guru dan tutor IPA (Biologi, Fisika, dan Kimia) yang ramah, pintar, dan edukatif. Jawablah pertanyaan siswa berikut secara ringkas, jelas, mudah dipahami, serta ramah: ${text}`
                            }]
                        }]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                let aiAnswer = "Maaf, Fitri sedang mengalami kendala jaringan. Coba tanyakan lagi ya! 😊";
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    aiAnswer = data.candidates[0].content.parts[0].text.replace(/\n/g, '<br>');
                }

                const fitriBubble = `
                    <div class="flex items-start gap-3">
                        <img src="fitri.jpg" onerror="this.onerror=null; this.src='public/fitri.jpg';" class="w-8 h-8 rounded-full border border-indigo-400 object-cover shrink-0">
                        <div class="bg-slate-800 p-3 rounded-2xl rounded-tl-none border border-slate-700 text-sm max-w-[85%] leading-relaxed">
                            ${aiAnswer}
                        </div>
                    </div>
                `;
                chatBox.insertAdjacentHTML('beforeend', fitriBubble);

            } catch (error) {
                document.getElementById(loadingId).remove();
                const errorBubble = `
                    <div class="flex items-start gap-3">
                        <img src="fitri.jpg" onerror="this.onerror=null; this.src='public/fitri.jpg';" class="w-8 h-8 rounded-full border border-indigo-400 object-cover shrink-0">
                        <div class="bg-slate-800 p-3 rounded-2xl rounded-tl-none border border-slate-700 text-sm max-w-[85%] text-red-400">
                            Fitri gagal terhubung ke server AI. Pastikan API Key Gemini kamu sudah terpasang dengan benar!
                        </div>
                    </div>
                `;
                chatBox.insertAdjacentHTML('beforeend', errorBubble);
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>
</body>
</html>
