<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fitri - IPA AI Tutor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-slate-900 text-white flex flex-col justify-between font-sans">

    <!-- Header -->
    <header class="p-3 bg-slate-800 border-b border-slate-700 flex items-center gap-3 shrink-0">
        <img src="fitri.jpg" 
             onerror="this.onerror=null; this.src='public/fitri.jpg';" 
             alt="Fitri Avatar" 
             class="w-10 h-10 rounded-full border-2 border-indigo-400 object-cover shrink-0">
        <div>
            <h1 class="font-bold text-base text-indigo-300 leading-tight">Fitri AI Tutor IPA</h1>
            <p class="text-xs text-slate-400">Tutor Biologi, Fisika, & Kimia</p>
        </div>
    </header>

    <!-- Chat Container -->
    <main id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-4 max-w-2xl mx-auto w-full">
        <!-- Pesan Sambutan Fitri -->
        <div class="flex items-start gap-3">
            <img src="fitri.jpg" onerror="this.onerror=null; this.src='public/fitri.jpg';" class="w-8 h-8 rounded-full border border-indigo-400 object-cover shrink-0">
            <div class="bg-slate-800 p-3 rounded-2xl rounded-tl-none border border-slate-700 text-sm max-w-[85%] leading-relaxed">
                Halo! Aku <b>Fitri</b>, tutor IPA kamu. Kamu bisa tanya soal pelajaran 🧪 <b>Kimia</b>, 🧬 <b>Biologi</b>, maupun ⚡ <b>Fisika</b>. Ada materi yang mau kamu tanyakan hari ini? 😊
            </div>
        </div>
    </main>

    <!-- Input Form -->
    <footer class="p-3 bg-slate-800 border-t border-slate-700 max-w-2xl mx-auto w-full shrink-0">
        <form id="chat-form" class="flex gap-2">
            <input type="text" id="user-input" placeholder="Tanyakan soal Biologi, Fisika, Kimia..." required class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
            <button type="submit" id="send-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-xl text-sm font-semibold transition shrink-0">
                Kirim
            </button>
        </form>
    </footer>

    <!-- LOGIKA AI AKURAT & BEBAS ERROR -->
    <script>
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');

        // Database Pengetahuan IPA Cerdas (Backup Cepat & Akurat)
        function getIPAResponse(query) {
            const q = query.toLowerCase();

            if (q.includes('pengertian sel') || q.includes('apa itu sel')) {
                return "<b>Sel</b> adalah unit terkecil dari struktur dan fungsi pada makhluk hidup. Semua organisme, mulai dari bakteri hingga manusia, tersusun atas sel. Sel melakukan fungsi dasar kehidupan seperti respirasi, pembelahan, dan metabolisme! 🧬";
            }
            if (q.includes('eukariotik') || q.includes('sel eukariotik')) {
                return "<b>Sel Eukariotik</b> adalah jenis sel yang sudah memiliki membran inti (nukleus) yang membungkus materi genetiknya (DNA). Contohnya terdapat pada sel tumbuhan, sel hewan, jamur, dan protista! 🌿🦁";
            }
            if (q.includes('prokariotik') || q.includes('sel prokariotik')) {
                return "<b>Sel Prokariotik</b> adalah sel yang TIDAK memiliki membran inti sel. Materi genetiknya tersebar langsung di sitoplasma. Contoh utamanya adalah Bakteri dan Archaea! 🧫";
            }
            if (q.includes('fotosintesis')) {
                return "<b>Fotosintesis</b> adalah proses pembuatan makanan oleh tumbuhan hijau menggunakan cahaya matahari, air ($H_2O$), dan karbon dioksida ($CO_2$) untuk menghasilkan glukosa ($C_6H_{12}O_6$) dan oksigen ($O_2$)! 🍃☀️";
            }
            if (q.includes('atom') || q.includes('struktur atom')) {
                return "<b>Atom</b> adalah partikel terkecil dari suatu unsur kimia. Atom terdiri dari inti atom (yang berisi <b>Proton</b> bermuatan positif dan <b>Neutron</b> bermuatan netral) serta dikelilingi oleh <b>Elektron</b> bermuatan negatif! ⚛️";
            }
            if (q.includes('gaya') || q.includes('hukum newton')) {
                return "Dalam Fisika, <b>Gaya</b> ($F$) adalah dorongan atau tarikan yang dapat mengubah posisi/kecepatan benda. Menurut Hukum II Newton: $$F = m \\times a$$ (Gaya = Massa $\\times$ Percepatan) ⚡";
            }

            return null; // Jika pertanyaan di luar database umum
        }

        chatForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const text = userInput.value.trim();
            if(!text) return;

            // 1. Tampilkan Pesan User
            const userBubble = `
                <div class="flex items-start gap-3 justify-end">
                    <div class="bg-indigo-600 p-3 rounded-2xl rounded-tr-none text-sm max-w-[85%] leading-relaxed text-white">
                        ${text}
                    </div>
                </div>
            `;
            chatBox.insertAdjacentHTML('beforeend', userBubble);
            userInput.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // 2. Loading
            const loadingId = 'loading-' + Date.now();
            const loadingBubble = `
                <div id="${loadingId}" class="flex items-start gap-3">
                    <img src="fitri.jpg" onerror="this.onerror=null; this.src='public/fitri.jpg';" class="w-8 h-8 rounded-full border border-indigo-400 object-cover shrink-0">
                    <div class="bg-slate-800 p-3 rounded-2xl rounded-tl-none border border-slate-700 text-sm max-w-[85%] text-slate-400 italic">
                        Fitri sedang berpikir... 💭
                    </div>
                </div>
            `;
            chatBox.insertAdjacentHTML('beforeend', loadingBubble);
            chatBox.scrollTop = chatBox.scrollHeight;

            // 3. Cek Jawaban
            setTimeout(async () => {
                document.getElementById(loadingId)?.remove();

                let answer = getIPAResponse(text);

                // Jika tidak ada di DB lokal, panggil API Online cadangan yang stabil
                if (!answer) {
                    try {
                        const res = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(text + " IPA sains")}&format=json&no_html=1&skip_disambig=1`);
                        const data = await res.json();
                        if (data.AbstractText) {
                            answer = data.AbstractText;
                        } else {
                            answer = `Pertanyaan menarik tentang <b>"${text}"</b>! Konsep ini berhubungan erat dengan materi IPA. Bisakah kamu memperjelas bagian mana yang ingin dipelajari (misal: definisi, rumus, atau contoh soalnya)? 😊`;
                        }
                    } catch (err) {
                        answer = `Untuk materi <b>"${text}"</b>, coba perjelas istilah atau topiknya ya! Fitri siap membantu menjelaskan konsep Biologi, Fisika, maupun Kimia. 🧪🧬⚡`;
                    }
                }

                const fitriBubble = `
                    <div class="flex items-start gap-3">
                        <img src="fitri.jpg" onerror="this.onerror=null; this.src='public/fitri.jpg';" class="w-8 h-8 rounded-full border border-indigo-400 object-cover shrink-0">
                        <div class="bg-slate-800 p-3 rounded-2xl rounded-tl-none border border-slate-700 text-sm max-w-[85%] leading-relaxed">
                            ${answer}
                        </div>
                    </div>
                `;
                chatBox.insertAdjacentHTML('beforeend', fitriBubble);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 600);
        });
    </script>
</body>
</html>
